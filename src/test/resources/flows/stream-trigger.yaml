id: stream-trigger
namespace: io.kestra.tests

triggers:
  - id: watch
    type: io.kestra.plugin.redis.stream.Trigger
    url: redis://:redis@localhost:6379/0
    key: stream_trigger_key
    group: trigger_group
    consumer: trigger_consumer
    count: 10

tasks:
  - id: end
    type: io.kestra.plugin.core.debug.Return
    format: "{{ trigger.count }} entries"
